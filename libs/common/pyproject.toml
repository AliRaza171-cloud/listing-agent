[project]
name = "lagent-common"
version = "0.1.0"
description = "Shared infrastructure for listing-agent microservices"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "sqlalchemy>=2.0,<2.1",
  "psycopg2-binary>=2.9,<3",
  "redis>=5.0,<7",
  "httpx>=0.27,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lagent_common"]
